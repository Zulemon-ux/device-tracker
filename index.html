<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Tracker Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .status {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            text-align: left;
            min-height: 200px;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status a {
            color: #a8b5ff;
            text-decoration: none;
            transition: color 0.3s;
        }
        .status a:hover {
            color: #fff;
            text-decoration: underline;
        }
        .info {
            margin-top: 20px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.2);
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Device Tracker Pro</h1>
        <p class="subtitle">Lacak perangkat dengan lokasi detail</p>
        
        <div class="status" id="status">
            <div class="loader"></div>
            <p style="text-align: center;">Mengumpulkan data...</p>
        </div>
        
        <div class="info">
            <p>📍 Lokasi dari IP + GPS (jika diizinkan)</p>
            <p>🔒 Data hanya untuk keperluan tracking</p>
        </div>
    </div>

    <script src="tracker.js"></script>
</body>
</html>
